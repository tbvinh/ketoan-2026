
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Login Dashboard</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="has-background-light">
    

<section class="section">
  <div class="container">
    <h1 class="title">Đăng nhập</h1>

    <!-- Form login -->
    <form hx-post="/login" hx-target="#login-result" hx-swap="innerHTML" class="box">
      <div class="field">
        <label class="label">Tên đăng nhập</label>
        <div class="control">
          <input class="input" type="text" name="username" placeholder="Nhập tên đăng nhập">
        </div>
      </div>

      <div class="field">
        <label class="label">Mật khẩu</label>
        <div class="control">
          <input class="input" type="password" name="password" placeholder="Nhập mật khẩu">
        </div>
      </div>

      <div class="field">
        <div class="control">
          <button class="button is-primary" type="submit">Đăng nhập</button>
        </div>
      </div>
    </form>

    <!-- Kết quả login -->
    <div id="login-result"></div>
  </div>
</section>

</body>
</html>
