
<h2>Tạo phiếu nhập kho mới</h2>

    <div class="field">
        <label class="label">Nhà cung cấp</label>
        <input class="input" type="text" name="nhaCungCap" placeholder="Tên nhà cung cấp (có thể để trống)" />

    <button type="submit" class="button is-primary">Tạo phiếu</button>
