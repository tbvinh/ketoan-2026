<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{#insert title}Outlook Style App{/}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        /* GIỮ NGUYÊN 100% CSS CỦA BẠN */
        body { font-family: "Segoe UI", sans-serif; background-color: #f8f9fa; }
        .topbar { background-color: #0078d4; color: white; padding: 10px; position: fixed; top: 0; left: 0; right: 0; z-index: 1002; height: 50px; }
        .search-wrapper { position: relative; display: inline-flex; align-items: center; }
        .search-input { width: 200px; padding-right: 32px; font-size: 13px; border-radius: 4px; transition: all 0.2s ease-in-out; }
        .search-input:focus { width: 240px; background-color: #ffffff; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4); }
        .btn-search-icon { position: absolute; right: 4px; background: transparent; border: none; color: #0078d4; padding: 2px 6px; border-radius: 3px; cursor: pointer; opacity: 0; visibility: hidden; transform: scale(0.8); transition: all 0.2s ease-in-out; }
        .btn-search-icon:hover { background-color: #f3f2f1; }
        .search-wrapper:focus-within .btn-search-icon { opacity: 1; visibility: visible; transform: scale(1); }
        
        .sidebar-icons { height: calc(100vh - 50px); width: 60px; background-color: #f3f2f1; border-right: 1px solid #ddd; position: fixed; top: 40px; left: 0; text-align: center; padding-top: 0px; z-index: 1001; }
        .sidebar-icons a { display: block; color: #555; font-size: 20px; margin: 10px 0; text-decoration: none; padding: 10px 0; transition: color 0.2s, background-color 0.2s; position: relative; cursor: pointer; }
        .sidebar-icons a:hover { color: #0078d4; background-color: rgba(0, 0, 0, 0.04); }
        .sidebar-icons a.active { color: #0078d4; background-color: #d9d9d9; }
        .sidebar-icons a.active::before { content: ""; position: absolute; top: 0; left: 0; width: 2px; height: 100%; background-color: #0078d4; border-radius: 0 2px 2px 0; }
        
        .menubar { background-color: #f3f2f1; border-bottom: 1px solid #ddd; position: fixed; top: 50px; left: 60px; right: 0; height: 40px; z-index: 999; display: flex; align-items: center; padding: 0 10px; }
        .menubar .nav-link { color: #333; padding: 8px 14px; font-size: 14px; font-weight: 500; cursor: pointer; position: relative; transition: all 0.2s ease; }
        .menubar .nav-link:hover { color: #0078d4; background-color: rgba(0, 0, 0, 0.04); border-radius: 4px; }
        .menubar .nav-link.active { color: #0078d4; font-weight: 600; }
        .menubar .nav-link.active::after { content: ""; position: absolute; bottom: -1px; left: 10%; width: 80%; height: 3px; background-color: #0078d4; border-radius: 3px 3px 0 0; box-shadow: 0 1px 3px rgba(0, 120, 212, 0.4); }
        
        .toolbar { background: linear-gradient(180deg, #ffffff 0%, #f3f2f1 100%); border: 1px solid #d2d0ce; border-radius: 8px; position: fixed; top: 95px; left: 65px; right: 10px; height: 44px; z-index: 998; display: flex; align-items: center; padding: 0 10px; box-shadow: 0 3px 6px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.12); }
        .toolbar .btn { font-size: 13px; font-weight: 500; padding: 4px 12px; }
        
        .sidebar-main { height: calc(100vh - 145px); background-color: #f3f2f1; border-right: 1px solid #ddd; padding-top: 0px; position: fixed; top: 145px; left: 60px; width: 200px; transition: transform 0.3s ease; z-index: 996; }
        .sidebar-main.hidden { transform: translateX(-200px); }
        .sidebar-main a { color: #333; text-decoration: none; display: block; padding: 10px 20px; font-size: 14px; transition: background-color 0.2s; 
            border-radius: 5px;
            margin-right: 4px;
            margin-left: 4px;}
        .sidebar-main a:hover { background-color: #ffc107; font-weight: 600;     cursor: pointer;} 
        .sidebar-main a.active-sub { background-color: #ffc1072b; font-weight: 600; }
        
        .content { margin-left: 260px; padding: 20px; margin-top: 145px; transition: margin-left 0.3s ease; }
        .content.expanded { margin-left: 60px; }
    </style>
</head>
<body>

    {#include components/topbar /}
    {#include components/sidebar-icons /}
    {#include components/menubar /}
    <!-- Nơi hiển thị Toolbar -->
<div class="toolbar"  id="toolbarContainer">
    <!-- Load mặc định lần đầu khi vào trang -->
    {#include components/toolbar.html /}
</div>
    <!-- BỌC CONTAINER ĐỂ SWAP SIDEBAR MAIN KHÔNG BỊ MẤT THẺ -->
    <div id="sidebarMainWrapper">
        {#include components/sidebar-main /}
    </div>

    <!-- Khu vực nạp dữ liệu động -->
    <div class="content" id="contentArea">
        <h4 id="contentTitle">{contentTitle ?: 'Inbox'}</h4>
        <div id="mainContent">
            {#insert content}
                <!-- Nội dung mặc định ban đầu -->
            {/}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.addEventListener('click', function (e) {
        // 1. Toggle Sidebar ẩn/hiện (Không bị mất khi HTMX tráo sidebar)
        const toggleBtn = e.target.closest('#toggleSidebar');
        if (toggleBtn) {
            const sidebar = document.querySelector('.sidebar-main');
            const contentArea = document.getElementById('contentArea');
            
            if (sidebar) sidebar.classList.toggle('hidden');
            if (contentArea) contentArea.classList.toggle('expanded');
            return;
        }

        // 2. Click Icon Sidebar: Active UI + Tải nội dung trang chính tương ứng
        const iconLink = e.target.closest('.sidebar-icons a');
        if (iconLink) {
            document.querySelectorAll('.sidebar-icons a').forEach(el => el.classList.remove('active'));
            iconLink.classList.add('active');

            // Đọc URL từ data-content-url và gọi HTMX nạp vào #mainContent
            //const contentUrl = iconLink.getAttribute('data-content-url');
            //if (contentUrl && window.htmx) {
            //    htmx.ajax('GET', contentUrl, { target: '#mainContent', swap: 'innerHTML' });
            //}
        }

        // 3. Click Submenu trong Sidebar Main: Active + Đổi Tiêu Đề
        const subLink = e.target.closest('.sidebar-main a');
        if (subLink) {
            document.querySelectorAll('.sidebar-main a').forEach(el => el.classList.remove('active-sub'));
            subLink.classList.add('active-sub');

            //const titleText = subLink.textContent.trim();
            //const contentTitle = document.getElementById('contentTitle');
            //if (contentTitle) contentTitle.innerText = titleText;
        }
        // 4. Click các mục trong Menubar (File, Edit, View, Tools, Help): Active UI
        const menuLink = e.target.closest('.menubar .nav-link');
        if (menuLink) {
            // Xóa active của tất cả các tab trên menubar
            document.querySelectorAll('.menubar .nav-link').forEach(el => el.classList.remove('active'));
            // Thêm active vào tab vừa được bấm
            menuLink.classList.add('active');
        }
    });
</script>
</body>
</html>
