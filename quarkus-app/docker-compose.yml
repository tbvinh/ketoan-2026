services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ke_toan}
      POSTGRES_USER: ${POSTGRES_USER:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    ports:
      - "5432:5432"
  app:
    image: ${APP_IMAGE:-ketoan-app:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ke_toan}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-laravel}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      QUARKUS_HTTP_HOST: 0.0.0.0
      MEDIA_UPLOAD_DIR: /app/uploads
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - quarkus-app
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./uploads:/usr/share/nginx/html/uploads:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    stop_grace_period: 10s
