map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    root /usr/share/nginx/html;

    # Docker embedded DNS resolver (cho phép khởi động ngay cả khi container quarkus-app đang tắt để debug)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static media: /uploads/{company_code}/{type}/{uuid_filename.ext}
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
        access_log off;
    }

    # Quarkus REST API (ưu tiên container quarkus-app, tự động fallback về host mvn quarkus:dev khi debug)
    location /api/ {
        set $quarkus_upstream http://quarkus-app:8080;
        proxy_pass $quarkus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @quarkus_dev;
    }

    # Quinoa React UI (ưu tiên container quarkus-app, tự động fallback về host mvn quarkus:dev khi debug)
    location / {
        set $quarkus_upstream http://quarkus-app:8080;
        proxy_pass $quarkus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @quarkus_dev;
    }

    # Fallback sang mvn quarkus:dev đang chạy trên máy host (cổng 8080)
    location @quarkus_dev {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
