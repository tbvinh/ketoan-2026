
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-php
    container_name: php_app
    volumes:
      - ./php:/var/www/html
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8085:80"
    volumes:
      - ./php:/var/www/html
      - ./nginx-app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app_network

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ke_toan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  quarkus:
    build:
      context: ./quarkus-app
      dockerfile: Dockerfile
    container_name: quarkus_service
    ports:
      - "8081:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/ke_toan
      QUARKUS_DATASOURCE_USERNAME: laravel
      QUARKUS_DATASOURCE_PASSWORD: secret
    volumes:
      - quarkusdata:/app
    depends_on:
      - postgres
    networks:
      - app_network
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8082:80"
    depends_on:
      - postgres
    volumes:
      - pgadmindata:/var/lib/pgadmin
    networks:
      - app_network

networks:
  app_network:

volumes:
  pgdata:
  pgadmindata:
  quarkusdata:
